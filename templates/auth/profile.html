{% extends 'auth/base.html' %}
{% block title %}Профиль — SABT{% endblock %}
{% block content %}
<div class="profile-shell"><section class="auth-card profile-card" aria-labelledby="page-title"><a class="brand" href="{% url 'service_list_view' %}"><span class="brand__icon" aria-hidden="true">S</span><span class="brand__name">SABT</span></a><p class="eyebrow">Личный кабинет</p><h1 id="page-title">Мой профиль</h1><p class="auth-intro">Обновите имя и адрес электронной почты.</p>{% if error %}<div class="notice notice--error" role="alert">{{ error }}</div>{% endif %}<form method="post" class="auth-form">{% csrf_token %}<div class="form-field"><label for="id_username">Имя пользователя</label><input id="id_username" name="username" value="{{ request.POST.username|default:request.user.username }}" autocomplete="username" required></div><div class="form-field"><label for="id_email">Электронная почта</label><input id="id_email" type="email" name="email" value="{{ request.POST.email|default:request.user.email }}" autocomplete="email" required></div><button class="button button--primary" type="submit">Сохранить профиль</button></form><p class="auth-footer"><a href="{% url 'change_password_view' %}">Сменить пароль</a> · <a href="{% url 'home' %}">В кабинет</a></p></section></div>
{% endblock %}
