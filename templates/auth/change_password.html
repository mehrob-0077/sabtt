{% extends 'auth/base.html' %}
{% block title %}Смена пароля — SABT{% endblock %}
{% block content %}
<div class="profile-shell"><section class="auth-card profile-card" aria-labelledby="page-title"><a class="brand" href="{% url 'home' %}"><span class="brand__icon" aria-hidden="true">S</span><span class="brand__name">SABT</span></a><p class="eyebrow">Безопасность аккаунта</p><h1 id="page-title">Новый пароль</h1><p class="auth-intro">Введите текущий пароль и выберите новый.</p>{% if error %}<div class="notice notice--error" role="alert">{{ error }}</div>{% endif %}<form method="post" class="auth-form">{% csrf_token %}<div class="form-field"><label for="old_password">Текущий пароль</label><input id="old_password" name="old_password" type="password" autocomplete="current-password" required></div><div class="form-field"><label for="password1">Новый пароль</label><input id="password1" name="password1" type="password" autocomplete="new-password" required></div><div class="form-field"><label for="password2">Повторите новый пароль</label><input id="password2" name="password2" type="password" autocomplete="new-password" required></div><button class="button button--primary" type="submit">Изменить пароль</button></form><p class="auth-footer"><a href="{% url 'home' %}">Вернуться в кабинет</a></p></section></div>
{% endblock %}
